name: 🐛 Bug Report
description: File a report to help us reproduce and fix a bug in Keisuki.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce this issue?
      placeholder: |
        1. Open the app
        2. Tap on counter card '...'
        3. Observe crash/incorrect state
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: Describe the expected behavior...
    validations:
      required: true
  - type: input
    id: device-info
    attributes:
      label: Device Information
      description: Device model and Android OS version
      placeholder: e.g. Google Pixel 8, Android 15 (API 35)
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App Version / Git Commit
      description: Which version or commit hash are you using?
      placeholder: e.g. v1.0.0 or commit abc1234
    validations:
      required: false
  - type: textarea
    id: logs-screenshots
    attributes:
      label: Logs or Screenshots
      description: Paste relevant Logcat output or drag and drop screenshots here.
      placeholder: Logcat error stack traces, screenshots, or screen recordings...
    validations:
      required: false
