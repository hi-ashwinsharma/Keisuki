name: ✨ Feature Request
description: Suggest an idea or enhancement for Keisuki.
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a new idea to make Keisuki better!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
      placeholder: Describe your suggested feature or UX enhancement...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
      placeholder: Describe any alternatives you've thought of...
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context / Mockups
      description: Add any other context, screenshots, or design sketches here.
    validations:
      required: false
