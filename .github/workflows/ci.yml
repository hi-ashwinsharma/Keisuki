name: Android CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Create mock google-services.json for CI
        working-directory: android
        run: |
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"0","project_id":"keisuki-mock","storage_bucket":""},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:mock","android_client_info":{"package_name":"com.hiashwinsharma.keisuki"}},"oauth_client":[],"api_key":[{"current_key":"mock_key"}],"services":{"analytics_service":{"status":1}}}]}' > app/google-services.json
          fi

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Run Unit Tests
        working-directory: android
        run: ./gradlew test --stacktrace

      - name: Assemble Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: keisuki-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
